name: release

# Continuous deployment: every push to main whose package.json version has no GitHub release yet
# is tested, packaged, published to the VS Code Marketplace and released on GitHub with its .vsix.
# Publishing authenticates by Marketplace trusted publishing (OIDC): the DJRHails publisher's
# policy names this repository and this workflow file, so no token is stored anywhere.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Stays GitHub-hosted on purpose: the job exchanges an OIDC token for a Marketplace
    # publishing credential, which must not sit on the shared taffy pool.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # Marketplace trusted publishing
    env:
      VSCE: "@vscode/vsce@4.1.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Decide whether this version is unreleased
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          name="$(jq -r .name package.json)"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "vsix=${name}-${version}.vsix" >>"$GITHUB_OUTPUT"
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v${version} is already released; nothing to do"
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci
          npm test

      - name: Package
        if: steps.version.outputs.release == 'true'
        env:
          VSIX: ${{ steps.version.outputs.vsix }}
        # Not --no-dependencies: the extension ships its runtime dependency (diff); vsce bundles
        # the production tree only.
        run: npx --yes "$VSCE" package --out "$VSIX"

      - name: Publish to the Marketplace
        if: steps.version.outputs.release == 'true'
        env:
          VSIX: ${{ steps.version.outputs.vsix }}
        run: npx --yes "$VSCE" publish --oidc --skip-duplicate --packagePath "$VSIX"

      - name: Release on GitHub
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          gh release create "v${VERSION}" "$VSIX" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
